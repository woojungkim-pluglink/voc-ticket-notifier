name: voc-tickets

# VOC 티켓 알림 — GitHub Actions 이전판.
# 개인 PC(Task Scheduler/WSL) SPOF를 제거하고 상시가동 인프라에서 구동한다.
# 스케줄은 UTC 기준(GitHub Actions). KST = UTC+9.
on:
  schedule:
    # notify 폴백: KST 평일 09:00~17:50 (= UTC 00:00~08:50).
    # 실제 알림 주기는 n8n 트리거(10분, 평일 업무시간)가 만든다 — N8N_TRIGGER.md.
    # 이 내장 cron 은 n8n 정지 대비 폴백이며, GitHub 스케줄 특성상 실측 하루 3~4회만 실행된다.
    #
    # 2026-10-15 개발팀장 합의: 회사 API(apis.pluglink.kr) 부하를 줄이기 위해 업무시간만 운영.
    #   (2026-09-09~10-15 은 24시간이었고, 하루 약 150회·약 9,000 API 호출이 발생했다.)
    #   야간·주말 실행을 늘리려면 개발팀과 먼저 협의할 것 — 이 봇은 실서비스와 같은 서버를 쓴다.
    - cron: '*/10 0-8 * * 1-5'
    # summary 예약은 2026-10-15 제거했다. 요약은 n8n 09:00 workflow_dispatch(mode=summary)로만 보낸다.
    #   제거 이유: 내장 summary cron('0 0 * * 1-5')을 GitHub 이 4~6시간 늦게 발화시켜 13~15시에
    #   요약이 한 번 더 게시됐다(10/5~10/14 평일 8일 전부 확인). notify 는 상태로 중복을 막지만
    #   summary 는 보낸 기록 없이 매번 게시하는 구조라 폴백으로 남겨 두면 안 된다.
    #   대가: n8n 이 멈춘 날은 요약이 나가지 않는다. 날짜 가드('오늘 이미 보냈으면 생략')를 넣으면 폴백 복원 가능.
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드'
        type: choice
        options: [notify, summary]
        default: notify
      dry_run:
        description: '드라이런(Slack 미발송·상태 미변경)'
        type: boolean
        default: false

# notify와 summary(그리고 겹치는 00:00 UTC 실행)가 같은 상태를 동시에 건드리지 않도록 직렬화.
# 과거 로컬 판의 09:00 notify·summary 경합(중복 발송)을 구조적으로 제거.
concurrency:
  group: voc-ticket-state
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
        # 의존성 없음 — 표준 라이브러리(urllib)만 사용하므로 pip install 불필요.

      - name: CI용 설정 배치 (비-시크릿 채널·멤버 매핑)
        run: cp ticket_config.ci.json ticket_config.json

      # 스냅샷 상태를 캐시로 영속(러너는 stateless). 롤링 캐시 패턴:
      # 항상 최신(voc-state-*)을 복원하고, 실행 후 run_id 키로 새 캐시를 저장.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: ticket_state.json
          key: voc-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            voc-state-

      - name: Run notifier
        id: run
        env:
          # 시크릿은 GitHub Actions Secrets에서만 주입 (코드는 env 폴백으로 읽음).
          PLUGLINK_EMAIL: ${{ secrets.PLUGLINK_EMAIL }}
          PLUGLINK_PASSWORD: ${{ secrets.PLUGLINK_PASSWORD }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          set -euo pipefail
          # 어떤 cron이 트리거했는지로 모드 결정. 수동 실행 시엔 입력값 사용.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
            DRY="${{ github.event.inputs.dry_run }}"
          elif [ "${{ github.event.schedule }}" = "0 0 * * 1-5" ]; then
            # 제거된 summary 예약의 잔여 발화(GitHub 이 이미 대기열에 넣은 지연 실행)가 와도
            # 요약을 다시 게시하지 않도록 notify 로 돌린다. notify 는 상태 기반이라 중복이 없다.
            MODE="notify"
            DRY="false"
          else
            MODE="notify"
            DRY="false"
          fi
          echo "mode=$MODE dry_run=$DRY"
          if [ "$DRY" = "true" ]; then
            python3 ticket_notifier.py "$MODE" --dry-run
          else
            python3 ticket_notifier.py "$MODE"
          fi

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ticket_state.json
          key: voc-state-${{ github.run_id }}-${{ github.run_attempt }}

      # C1(자기감시): 실행 실패 시 조용히 죽지 않고 Slack으로 경보.
      # VOC_ALERT_TARGET = 경보 받을 채널ID 또는 사용자ID(DM). 미설정 시 이 스텝은 스킵.
      - name: 실패 경보 (Slack)
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          ALERT: ${{ secrets.VOC_ALERT_TARGET }}
        run: |
          if [ -z "${ALERT:-}" ]; then
            echo "VOC_ALERT_TARGET 미설정 — 실패 경보 스킵"
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-type: application/json; charset=utf-8" \
            --data "$(printf '{"channel":"%s","text":":rotating_light: VOC 티켓 알림 실행 실패\n%s"}' "$ALERT" "$RUN_URL")" \
            > /dev/null
