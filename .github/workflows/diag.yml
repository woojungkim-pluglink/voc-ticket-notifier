name: diag
on:
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      E: ${{ secrets.PLUGLINK_EMAIL }}
      P: ${{ secrets.PLUGLINK_PASSWORD }}
    steps:
      - name: probe signin with real secrets
        run: |
          # 값 자체는 출력하지 않고 길이만 — 공백/개행 혼입·빈값 탐지용.
          # 기대: 이메일 23자(woojung.kim@pluglink.kr), 비번 10자(Rla910406!)
          echo "email length = ${#E}"
          echo "password length = ${#P}"
          echo "== POST signIn (실제 Secret) =="
          curl -s -w "\nHTTP %{http_code}\n" -X POST \
            https://apis.pluglink.kr/v101/auths/admins/signIn \
            -H "Content-Type: application/json" \
            -H "x-token: 1" -H "x-channel: PLUGLINK" -H "x-platform: WEB" \
            -H "Origin: https://connect.pluglink.kr" \
            -d "$(printf '{"email":"%s","password":"%s","authType":"ORGANIC","partnerId":1}' "$E" "$P")" \
            | head -c 800
          echo
